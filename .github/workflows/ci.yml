name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[test]'
      - run: python -m compileall -q ishworkzero
      - run: pytest
      - run: python release_gate.py
      - run: sha256sum pyproject.toml ishworkzero/main.py ishworkzero/core/proof.py ishworkzero/infra/sqlite_jobs.py
