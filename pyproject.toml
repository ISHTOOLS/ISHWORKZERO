[project]
name = "ishworkzero"
version = "0.5.0"
description = "AI outcome assurance, real-data fabric, global intelligence and cryptographic proof infrastructure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
databases = ["psycopg[binary]>=3.2,<4", "pymysql>=1.1,<2", "pyodbc>=5.2,<6", "oracledb>=2.5,<3", "pymongo>=4.10,<5", "redis>=5,<7"]

[tool.setuptools.packages.find]
include = ["ishworkzero*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
